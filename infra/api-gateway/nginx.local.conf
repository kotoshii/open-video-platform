server {
    listen 4444;
    server_name _;

    # Redirect all /upload/ requests to tus
    # Source: https://github.com/tus/tusd/blob/68e8c65ee325737ff41ce686d81c64474d35ada0/examples/nginx.conf
    location /upload/ {
        # Add secret header from env
        proxy_set_header Tus-Webhook-Secret ${TUS_WEBHOOK_SECRET};

        # Forward incoming requests to local tusd instance
        # Note that the proxy's URL does not include a path/URI and not even a trailing slash, so
        # that Nginx passes the unmodified request URL to tusd.
        # https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_pass
        proxy_pass http://tusd:1080;

        # Disable request and response buffering
        proxy_request_buffering  off;
        proxy_buffering          off;
        proxy_http_version       1.1;

        # Add X-Forwarded-* headers
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header         Upgrade $http_upgrade;
        proxy_set_header         Connection "upgrade";
        client_max_body_size     0;
    }
}
