syntax = "proto3";

package comment_rates;

service CommentRateService {
	rpc GetRatesByIdsForChannel (GetRatesByIdsForChannelRequest) returns (GetRatesByIdsForChannelResponse);
}

enum CommentRateGrpcType {
	COMMENT_RATE_GRPC_TYPE_LIKE = 0;
	COMMENT_RATE_GRPC_TYPE_DISLIKE = 1;
}

message GetRatesByIdsForChannelRequest {
	repeated string comment_ids = 1;
	string channel_id = 2;
}

message GetRatesByIdsForChannelResponse {
	map<string, CommentRateGrpcType> rates = 1;
}