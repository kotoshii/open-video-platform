syntax = "proto3";

package users;

import "google/protobuf/timestamp.proto";

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
}

message CreateUserRequest {
  string email = 1;
  string date_of_birth = 2; // date string
  string password = 3;
}

message CreateUserResponse {
  bool success = 1;
  string message = 2;
  User user = 3;
}

message User {
  string id = 1;
  string email = 2;
  string date_of_birth = 3; // date string
  string created_at = 4; // date string
  string updated_at = 5; // date string
}